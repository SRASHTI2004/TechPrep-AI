[project]
name = "techprep-backend"
version = "1.0.0"
description = "TechPrep AI: chat with your interview-prep notes and PDFs, with page-level citations."
readme = "../README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2",
    "email-validator>=2.2",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "slowapi>=0.1.9",
    "structlog>=24.4",
    "fastembed>=0.4",
    "pypdf>=5.0",
    "google-genai>=1.0",
    "groq>=0.11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "httpx>=0.27",
]
# Local, Docker-free Postgres + pgvector for development/tests (see docs/DECISIONS.md D-001).
localdb = [
    "pgserver>=0.1.4",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
