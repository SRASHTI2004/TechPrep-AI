server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # API + health go to the backend container (same origin, so no CORS needed).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Server-Sent Events: stream tokens immediately instead of buffering the response.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
    location /health {
        proxy_pass http://api:8000;
    }

    # Hashed static assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: unknown paths serve the SPA.
    location / {
        try_files $uri /index.html;
    }
}
